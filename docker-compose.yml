services:
  postgres:
    image: postgres:17-alpine
    container_name: email_service_postgres
    environment:
      POSTGRES_DB: email_service
      POSTGRES_USER: alex
      POSTGRES_PASSWORD: Alexjose123.
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alex -d email_service"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
