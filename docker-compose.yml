services:
  postgres:
    image: postgres:17-alpine
    container_name: email_service_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-email_service}
      POSTGRES_USER: ${DB_USERNAME:-alex}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-alex} -d ${DB_NAME:-email_service}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
