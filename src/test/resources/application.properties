# ===== Mail — valores dummy para injeção de @Value (sender é @MockBean) =====
spring.mail.host=smtp.test.local
spring.mail.port=587
spring.mail.username=test@test.com
spring.mail.password=test-password
spring.mail.protocol=smtp

# ===== CORS =====
app.cors.allowed-origins=http://localhost:4200

# ===== Flyway — desabilitado por default; testes de integração habilitam via @DynamicPropertySource =====
spring.flyway.enabled=false

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Logging =====
logging.level.root=WARN
logging.level.com.alexsantosportfolio=DEBUG
