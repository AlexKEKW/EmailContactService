# Configurações da aplicação
server.port=8080
spring.application.name=EmailContactService

# Configurações do banco de dados - PostgreSQL (Produção)
#spring.datasource.url=jdbc:postgresql://localhost:5432/email_service
#spring.datasource.username=postgres
#spring.datasource.password=sua_senha
#spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do banco de dados - H2 (Desenvolvimento)
 spring.datasource.url=jdbc:h2:mem:testdb
 spring.datasource.driver-class-name=org.h2.Driver
 spring.datasource.username=sa
 spring.datasource.password=
 spring.h2.console.enabled=true
 spring.h2.console.path=/h2-console

# Configurações do JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

