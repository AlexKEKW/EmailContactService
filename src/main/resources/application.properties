server.port=8080
spring.application.name=EmailContactService

# ===== Banco de Dados =====
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:email_service}
spring.datasource.username=${DB_USERNAME:alex}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

#spring.datasource.url=jdbc:h2:mem:teste_email_service
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ===== Mail =====
spring.mail.host=${HOST_APP}
spring.mail.port=${PORTA_APP}
spring.mail.username=${EMAIL_APP}
spring.mail.password=${SENHA_APP}
spring.mail.protocol=${PROTOCOL_APP}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===== CORS =====
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# ===== Logging =====
logging.level.root=INFO
logging.level.com.alexsantosportfolio=DEBUG
logging.level.org.springframework.mail=DEBUG

# ===== HikariCP =====
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=60000

# ===== Thymeleaf =====
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
